name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连续 push 时，取消上一次还没跑完的，省排队时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查只需要跑一遍，和 Python 版本无关
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  # 测试跑矩阵，覆盖声明支持的最低版本和当前版本
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      # 单元测试用的是打桩 provider，这里再走一遍真实 HTTP：
      # 真发请求、真解析 SSE、真写磁盘、真制造一次崩溃再恢复
      - name: 端到端冒烟
        run: |
          python tools/smoke/fake_openai_server.py 8731 > /tmp/fake-llm.log 2>&1 &
          sleep 2
          python tools/smoke/smoke_e2e.py 8731

      - name: 冒烟失败时打印假服务端日志
        if: failure()
        run: cat /tmp/fake-llm.log

  # 前端独立一个 job：Node 侧的问题不该让 Python 矩阵重跑
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 ci 而不是 install：锁文件跟 package.json 对不上时直接失败，
      # 不静默地把版本装成别的样子
      - name: 安装依赖
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

      # 构建也要进 CI：类型过了、测试过了，不代表能打包出来
      - name: 构建
        run: npm run build
