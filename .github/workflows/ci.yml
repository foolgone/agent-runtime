name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连续 push 时，取消上一次还没跑完的，省排队时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查只需要跑一遍，和 Python 版本无关
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

  # 测试跑矩阵，覆盖声明支持的最低版本和当前版本
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      # 单元测试用的是打桩 provider，这里再走一遍真实 HTTP：
      # 真发请求、真解析 SSE、真写磁盘、真制造一次崩溃再恢复
      - name: 端到端冒烟
        run: |
          python tools/smoke/fake_openai_server.py 8731 > /tmp/fake-llm.log 2>&1 &
          sleep 2
          python tools/smoke/smoke_e2e.py 8731

      - name: 冒烟失败时打印假服务端日志
        if: failure()
        run: cat /tmp/fake-llm.log

  # 前端独立一个 job：Node 侧的问题不该让 Python 矩阵重跑
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 ci 而不是 install：锁文件跟 package.json 对不上时直接失败，
      # 不静默地把版本装成别的样子
      - name: 安装依赖
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

      # 构建也要进 CI：类型过了、测试过了，不代表能打包出来
      - name: 构建
        run: npm run build

  # 镜像也要真的构建一遍。Dockerfile 是最容易烂的东西 ——
  # 改了目录结构、加了个依赖忘了写进 pyproject，本地有 venv 和 node_modules 顶着，
  # 只有从零构建才会暴露。缓存让日常跑只花几十秒。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agent-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建成功不等于能跑起来。真起一个容器，等它通过自己的 HEALTHCHECK ——
      # 那条检查打的是 /healthz，所以这同时验证了包能导入、应用能构造、端口在听。
      #
      # 密钥给的是假值。`Settings.from_env()` 是启动时快速失败的，不给就起不来；
      # 但 provider 是懒建的，只读接口根本不会用到它。所以这里接上一个
      # 永远连不上的假配置，恰好验证了 test_read_only_endpoints_survive_broken_model_config
      # 断言的那条性质：模型配置写错不该让查询接口跟着挂。
      - name: 起容器并等健康检查
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e AGENT_MODEL=ci-model -e AGENT_API_KEY=ci-not-a-real-key \
            agent-runtime:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            echo "  $i: $status"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && docker logs smoke && exit 1
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' smoke | grep -q healthy

      - name: 打几个只读接口
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/sessions

      # 前端产物真的在镜像里、真的挂上了 / —— 这是这个镜像存在的理由，
      # 光看构建成功看不出来
      - name: 首页是构建出来的前端
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root"'

      - name: 失败时打印容器日志
        if: failure()
        run: docker logs smoke || true
